<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>523Co</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Bebas+Neue&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:        #1e1a17;
      --bg2:       #252018;
      --surface:   #2c2620;
      --grain:     rgba(255,220,180,0.03);
      --gold:      #b89a6a;
      --gold-dim:  #7a6445;
      --text:      #d4c4b0;
      --text-dim:  #7a6e62;
      --line:      rgba(184,154,106,0.18);
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Cormorant Garamond', serif;
      overflow: hidden;
    }

    /* grain overlay */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
      background-size: 160px;
      opacity: 0.55;
      pointer-events: none;
    }

    /* thin horizontal rule top */
    .rule-top {
      position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 10;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
    }

    /* center stage */
    .stage {
      position: relative; z-index: 1;
      width: 100%; height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0;
    }

    /* big number */
    .num {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(6rem, 22vw, 18rem);
      letter-spacing: 0.08em;
      color: transparent;
      -webkit-text-stroke: 1px var(--gold-dim);
      line-height: 1;
      opacity: 0;
      transform: translateY(30px);
      animation: rise 1.4s cubic-bezier(0.16,1,0.3,1) 0.2s forwards;
      user-select: none;
    }

    /* CO label */
    .co {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(1rem, 3.5vw, 2.4rem);
      letter-spacing: 0.55em;
      text-transform: uppercase;
      color: var(--gold);
      margin-top: -0.15em;
      opacity: 0;
      animation: rise 1.4s cubic-bezier(0.16,1,0.3,1) 0.5s forwards;
    }

    /* thin divider */
    .divider {
      width: clamp(60px, 12vw, 140px);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
      margin: 2.2rem 0;
      opacity: 0;
      animation: fade 1.2s ease 1s forwards;
    }

    /* corner marks */
    .corner {
      position: fixed;
      width: 28px; height: 28px;
      opacity: 0;
      animation: fade 1s ease 1.4s forwards;
    }
    .corner::before, .corner::after {
      content: '';
      position: absolute;
      background: var(--gold-dim);
    }
    .corner--tl { top: 24px; left: 24px; }
    .corner--tr { top: 24px; right: 24px; }
    .corner--bl { bottom: 24px; left: 24px; }
    .corner--br { bottom: 24px; right: 24px; }

    .corner--tl::before, .corner--tr::before,
    .corner--bl::before, .corner--br::before { width: 1px; height: 100%; top: 0; }
    .corner--tl::after,  .corner--tr::after,
    .corner--bl::after,  .corner--br::after  { width: 100%; height: 1px; top: 0; }

    .corner--tr::before { right: 0; left: auto; }
    .corner--bl::before { bottom: 0; top: auto; }
    .corner--bl::after  { bottom: 0; top: auto; }
    .corner--br::before { right: 0; left: auto; bottom: 0; top: auto; }
    .corner--br::after  { bottom: 0; top: auto; }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fade {
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="rule-top"></div>

  <div class="corner corner--tl"></div>
  <div class="corner corner--tr"></div>
  <div class="corner corner--bl"></div>
  <div class="corner corner--br"></div>

  <div class="stage">
    <div class="num">523</div>
    <div class="divider"></div>
    <div class="co">Co</div>
  </div>
</body>
</html>
